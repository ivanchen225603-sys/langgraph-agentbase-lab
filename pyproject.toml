[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-langgraph-lab"
version = "0.1.0"
description = "Local LangChain and LangGraph RAG, memory and durable Agent teaching lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.135.4", "uvicorn==0.42.0", "pydantic==2.13.5", "pydantic-settings==2.14.2",
  "langchain-core==1.6.6", "langchain-text-splitters==1.1.3",
  "langchain-openai==1.6.7", "langgraph==1.2.13",
  "langgraph-checkpoint-sqlite==3.1.1", "rank-bm25==0.2.2",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "pytest-cov==7.0.0",
       "httpx==0.28.1", "ruff==0.15.6", "mypy==1.19.1", "pip-audit==2.10.0", "build==1.4.0"]

[tool.setuptools.packages.find]
include = ["raglab*", "agentbase*"]

[tool.setuptools.package-data]
raglab = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::RuntimeWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
files = ["raglab", "agentbase"]

[tool.pydantic-mypy]
init_typed = false

\n